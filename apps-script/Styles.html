<style>
/* ==========================================================================
   Styles.html — one stylesheet for the login screen, admin dashboard and
   staff portal. Layout follows the supplied dashboard template; the palette is
   the house theme: navy blue as the brand colour, red as the accent, on a light
   neutral canvas with white cards, a rounded bar chart and a semicircle gauge.
   Status colours (green / amber / red) stay semantic so a pill still reads at a
   glance.
   ========================================================================== */

:root {
  /* brand — navy */
  --brand:        #0B2447;
  --brand-600:    #123A6B;
  --brand-500:    #1D4E89;
  --brand-soft:   #E7EDF7;
  --brand-softer: #F4F7FB;
  /* accent — red */
  --accent:       #C0271C;
  --accent-600:   #A11F16;
  --accent-700:   #8F1D14;
  --accent-soft:  #FDECEA;
  --bar:          #0B2447;
  --bar-soft:     #C3D0E4;
  --ink:          #0F172A;
  --ink-2:        #344054;
  --muted:        #6B7A90;
  --line:         #E3E8EF;
  --bg:           #F5F7FA;
  --card:         #FFFFFF;
  --amber:        #B45309;
  --amber-soft:   #FEF3C7;
  --red:          #B42318;
  --red-soft:     #FEE4E2;
  --blue:         #175CD3;
  --blue-soft:    #E7F0FE;
  --green:        #067647;
  --green-soft:   #E4F5EA;
  --r-sm: 8px; --r: 12px; --r-lg: 18px; --r-xl: 24px;
  --shadow: 0 1px 2px rgba(11,36,71,.04), 0 8px 24px rgba(11,36,71,.06);
  --shadow-lg: 0 12px 40px rgba(11,36,71,.16);
}

* { box-sizing: border-box; }
html, body { height: 100%; }
body {
  margin: 0; background: var(--bg); color: var(--ink);
  font-family: 'Poppins', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
  font-size: 14px; line-height: 1.5; -webkit-font-smoothing: antialiased;
}
a { color: var(--brand-600); text-decoration: none; }
a:hover { text-decoration: underline; }
h1,h2,h3,h4 { margin: 0; font-weight: 600; letter-spacing: -.01em; }
.hidden { display: none !important; }
.w-full { width: 100%; }
.block { display: block; width: 100%; }
.row-gap { display: flex; gap: 8px; align-items: center; }
.mt { margin-top: 14px; } .mt-lg { margin-top: 22px; }
.muted { color: var(--muted); }
.small { font-size: 12px; }
.mono { font-variant-numeric: tabular-nums; }
.nowrap { white-space: nowrap; }
.right { text-align: right; }
.center { text-align: center; }
.spread { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
.wrap { display: flex; flex-wrap: wrap; gap: 8px; }

/* ---------- Splash ---------- */
.splash { position: fixed; inset: 0; background: var(--bg); display: grid; place-items: center; z-index: 90; }
.splash-box { text-align: center; }
.splash-title { font-size: 20px; font-weight: 600; margin-top: 14px; }
.splash-sub { color: var(--muted); font-size: 13px; margin-top: 2px; }
.splash-bar { width: 200px; height: 4px; border-radius: 99px; background: var(--line); margin: 18px auto 0; overflow: hidden; }
.splash-bar span { display: block; height: 100%; width: 40%; border-radius: 99px;
  background: linear-gradient(90deg, var(--brand), var(--accent));
  animation: slide 1.1s ease-in-out infinite; }
@keyframes slide { 0% { transform: translateX(-100%); } 100% { transform: translateX(250%); } }

/* ---------- Brand mark ----------
   Holds either the company initial / tick or the logo image from
   Config.CompanyLogoUrl. When a logo is present the navy tile would fight with
   the artwork, so .has-logo drops the fill and lets the image breathe. */
.brand-mark {
  width: 30px; height: 30px; border-radius: 9px; background: var(--brand); color: #fff;
  display: inline-grid; place-items: center; font-size: 15px; font-weight: 700; flex: 0 0 auto;
  overflow: hidden;
}
.brand-mark.lg { width: 54px; height: 54px; border-radius: 16px; font-size: 26px; }
.brand-mark img { width: 100%; height: 100%; object-fit: contain; display: block; }
.brand-mark:has(img) { background: transparent; }
.brand-mark.has-logo { background: transparent; }
.brand-mark.lg.has-logo, .brand-mark.lg:has(img) { box-shadow: 0 0 0 3px var(--accent-soft); }

/* ---------- Shell ---------- */
.shell { display: grid; grid-template-columns: 252px minmax(0, 1fr); min-height: 100vh; }
.sidebar {
  background: var(--card); border-right: 1px solid var(--line);
  display: flex; flex-direction: column; padding: 18px 14px;
  position: sticky; top: 0; height: 100vh;
}
.sidebar-top { display: flex; align-items: center; justify-content: space-between; padding: 0 6px 6px; }
.logo { display: flex; align-items: center; gap: 10px; }
.logo-text { font-weight: 600; font-size: 16px; letter-spacing: -.02em; }

.nav { margin-top: 14px; overflow-y: auto; flex: 1; }
.nav-group { color: var(--muted); font-size: 11px; text-transform: uppercase;
  letter-spacing: .1em; padding: 14px 10px 6px; font-weight: 500; }
.nav-item {
  display: flex; align-items: center; gap: 10px; width: 100%;
  padding: 9px 10px; border: 0; background: transparent; border-radius: var(--r);
  color: var(--ink-2); font: inherit; cursor: pointer; text-align: left; margin-bottom: 2px;
}
.nav-item:hover { background: var(--brand-softer); color: var(--ink); }
.nav-item.active { background: var(--brand); color: #fff; font-weight: 500; }
.nav-item .ico { width: 18px; text-align: center; font-size: 14px; }
.nav-item .count {
  margin-left: auto; background: var(--brand-soft); color: var(--brand);
  border-radius: 99px; padding: 1px 8px; font-size: 11px; font-weight: 600;
}
.nav-item.active .count { background: rgba(255,255,255,.22); color: #fff; }

.nav-foot { border-top: 1px solid var(--line); padding-top: 12px; display: grid; gap: 8px; }
.promo { display: flex; gap: 10px; background: var(--brand-softer); border: 1px solid var(--line);
  border-radius: var(--r); padding: 12px; }
.promo-icon { width: 26px; height: 26px; border-radius: 8px; background: var(--brand);
  color: #fff; display: grid; place-items: center; flex: 0 0 auto; font-weight: 700; }
.promo-title { font-size: 13px; font-weight: 600; }
.promo-sub { font-size: 11.5px; color: var(--muted); }

/* ---------- Main + topbar ---------- */
.main { min-width: 0; display: flex; flex-direction: column; }
.topbar {
  display: flex; align-items: center; justify-content: space-between; gap: 16px;
  padding: 18px 26px; background: var(--bg); position: sticky; top: 0; z-index: 20;
  border-bottom: 1px solid var(--line);
}
.topbar-left { display: flex; align-items: center; gap: 12px; min-width: 0; }
.page-title { font-size: 21px; }
.page-sub { margin: 2px 0 0; font-size: 12.5px; color: var(--muted); }
.topbar-right { display: flex; align-items: center; gap: 8px; }
.search { display: flex; align-items: center; gap: 8px; background: var(--card);
  border: 1px solid var(--line); border-radius: 99px; padding: 7px 14px; min-width: 240px; }
.search span { color: var(--muted); }
.search input { border: 0; outline: 0; background: transparent; font: inherit; width: 100%; }
.period-select { border: 1px solid var(--line); background: var(--card); border-radius: 99px;
  padding: 8px 12px; font: inherit; font-size: 13px; color: var(--ink-2); cursor: pointer; }
.icon-btn { width: 36px; height: 36px; border-radius: 50%; border: 1px solid var(--line);
  background: var(--card); cursor: pointer; font-size: 15px; display: grid; place-items: center;
  position: relative; color: var(--ink-2); }
.icon-btn:hover { background: var(--brand-softer); }
.icon-btn .dot { position: absolute; top: 6px; right: 7px; width: 8px; height: 8px;
  border-radius: 50%; background: var(--red); border: 2px solid var(--card); }
.me { display: flex; align-items: center; gap: 9px; background: var(--card);
  border: 1px solid var(--line); border-radius: 99px; padding: 4px 12px 4px 4px; }
.me .who { line-height: 1.15; }
.me .who b { font-size: 12.5px; font-weight: 600; display: block; }
.me .who small { font-size: 11px; color: var(--muted); }

.view { padding: 22px 26px 8px; }
.foot { padding: 14px 26px 24px; color: var(--muted); font-size: 11.5px; }
.foot-sep { margin: 0 8px; }

/* ---------- Banner ---------- */
.notice { margin: 0 26px; border-radius: var(--r-lg); padding: 14px 18px; display: flex;
  gap: 12px; align-items: flex-start; border: 1px solid var(--line); background: var(--card); }
.notice.warn { background: var(--amber-soft); border-color: #FDE68A; color: #7C4A03; }
.notice.danger { background: var(--red-soft); border-color: #FDA29B; color: #7A271A; }
.notice.brand { background: var(--brand); border-color: var(--brand); color: #fff; }
.notice .n-title { font-weight: 600; }
.notice .n-body { font-size: 12.5px; opacity: .92; }

/* ---------- Grid + cards ---------- */
.grid { display: grid; gap: 16px; }
.g-4 { grid-template-columns: repeat(4, minmax(0,1fr)); }
.g-3 { grid-template-columns: repeat(3, minmax(0,1fr)); }
.g-2 { grid-template-columns: repeat(2, minmax(0,1fr)); }
.g-2-1 { grid-template-columns: 2fr 1fr; }
.g-1-2 { grid-template-columns: 1fr 2fr; }

.card { background: var(--card); border: 1px solid var(--line); border-radius: var(--r-xl);
  padding: 18px; box-shadow: var(--shadow); min-width: 0; }
.card.tight { padding: 14px; }
.card-head { display: flex; align-items: center; justify-content: space-between; gap: 10px;
  margin-bottom: 14px; }
.card-title { font-size: 15px; font-weight: 600; }
.card-sub { font-size: 11.5px; color: var(--muted); }

/* KPI tiles */
.kpi { background: var(--card); border: 1px solid var(--line); border-radius: var(--r-xl);
  padding: 18px; box-shadow: var(--shadow); }
.kpi.dark { background: var(--brand); border-color: var(--brand); color: #fff; }
.kpi .k-top { display: flex; align-items: center; justify-content: space-between; }
.kpi .k-label { font-size: 12.5px; color: var(--muted); }
.kpi.dark .k-label { color: rgba(255,255,255,.78); }
.kpi .k-val { font-size: 30px; font-weight: 600; letter-spacing: -.02em; margin-top: 8px; }
.kpi .k-foot { font-size: 11.5px; color: var(--muted); margin-top: 6px; display: flex;
  align-items: center; gap: 6px; }
.kpi.dark .k-foot { color: rgba(255,255,255,.78); }
.kpi .k-ico { width: 34px; height: 34px; border-radius: 50%; background: var(--brand-soft);
  color: var(--brand); display: grid; place-items: center; font-size: 15px; }
.kpi.dark .k-ico { background: rgba(255,255,255,.16); color: #fff; }
.trend.up { color: var(--green); } .trend.down { color: var(--red); }

/* ---------- Bar chart ---------- */
.chart { display: flex; align-items: flex-end; gap: 14px; height: 190px;
  padding: 10px 4px 0; border-bottom: 1px solid var(--line); }
.chart-col { flex: 1; display: flex; flex-direction: column; align-items: center;
  justify-content: flex-end; height: 100%; gap: 8px; min-width: 0; }
.chart-bar { width: 100%; max-width: 46px; border-radius: 99px; background: var(--bar);
  position: relative; transition: height .35s ease; min-height: 6px; }
.chart-bar.soft { background: var(--bar-soft); }
.chart-bar.hatch {
  background: repeating-linear-gradient(135deg, var(--bar) 0 6px, var(--accent) 6px 12px);
}
.chart-bar .tip { position: absolute; bottom: calc(100% + 8px); left: 50%; transform: translateX(-50%);
  background: var(--ink); color: #fff; font-size: 11px; padding: 4px 8px; border-radius: 6px;
  white-space: nowrap; opacity: 0; pointer-events: none; transition: opacity .15s; }
.chart-bar:hover .tip { opacity: 1; }
.chart-x { display: flex; gap: 14px; padding: 8px 4px 0; }
.chart-x span { flex: 1; text-align: center; font-size: 11.5px; color: var(--muted); }
.legend { display: flex; gap: 14px; flex-wrap: wrap; margin-top: 12px; }
.legend i { width: 10px; height: 10px; border-radius: 3px; display: inline-block; margin-right: 6px; }
.legend span { font-size: 11.5px; color: var(--muted); }

/* ---------- Gauge ---------- */
.gauge-wrap { display: grid; place-items: center; padding: 6px 0 0; }
.gauge { position: relative; width: 100%; max-width: 260px; }
.gauge svg { width: 100%; height: auto; display: block; }
.gauge-center { position: absolute; left: 0; right: 0; bottom: 6px; text-align: center; }
.gauge-center b { display: block; font-size: 30px; font-weight: 600; letter-spacing: -.02em; }
.gauge-center small { color: var(--muted); font-size: 11.5px; }

/* ---------- Tables ---------- */
.table-wrap { overflow-x: auto; margin: 0 -4px; }
table.tbl { width: 100%; border-collapse: separate; border-spacing: 0; font-size: 13px; }
table.tbl th { text-align: left; font-weight: 500; color: var(--muted); font-size: 11.5px;
  text-transform: uppercase; letter-spacing: .06em; padding: 8px 10px; white-space: nowrap; }
table.tbl td { padding: 11px 10px; border-top: 1px solid var(--line); vertical-align: middle; }
table.tbl tr:hover td { background: var(--brand-softer); }
table.tbl td.tight { width: 1%; white-space: nowrap; }

/* ---------- Pills & badges ---------- */
.pill { display: inline-flex; align-items: center; gap: 5px; font-size: 11.5px; font-weight: 500;
  padding: 3px 9px; border-radius: 99px; border: 1px solid transparent; white-space: nowrap; }
.pill.green  { background: var(--green-soft); color: var(--green); }
.pill.amber  { background: var(--amber-soft); color: var(--amber); }
.pill.red    { background: var(--red-soft);   color: var(--red); }
.pill.blue   { background: var(--blue-soft);  color: var(--blue); }
.pill.grey   { background: #EEF1F6; color: var(--ink-2); }
.pill.brand  { background: var(--brand-soft); color: var(--brand); }
.pill.accent { background: var(--accent-soft); color: var(--accent-600); }
.pill.outline { background: transparent; border-color: var(--line); color: var(--ink-2); }
.chip { font-size: 11px; padding: 2px 8px; border-radius: 6px; background: #EEF1F6; color: var(--ink-2); }

/* ---------- Buttons ---------- */
.btn { border: 1px solid var(--line); background: var(--card); color: var(--ink);
  border-radius: 99px; padding: 9px 16px; font: inherit; font-size: 13px; font-weight: 500;
  cursor: pointer; display: inline-flex; align-items: center; justify-content: center; gap: 7px; }
.btn:hover { background: var(--brand-softer); }
.btn:disabled { opacity: .55; cursor: not-allowed; }
.btn-brand { background: var(--brand); border-color: var(--brand); color: #fff; }
.btn-brand:hover { background: var(--brand-600); }
.btn-ghost { background: transparent; }
.btn-danger { background: var(--red); border-color: var(--red); color: #fff; }
.btn-danger:hover { background: var(--accent-700); }
.btn-accent { background: var(--accent); border-color: var(--accent); color: #fff; }
.btn-accent:hover { background: var(--accent-600); }
.btn-warn { background: var(--amber); border-color: var(--amber); color: #fff; }
.btn.sm { padding: 6px 12px; font-size: 12px; }
.btn.xs { padding: 4px 10px; font-size: 11.5px; }
.btn-link { border: 0; background: transparent; color: var(--brand-600); padding: 2px 4px;
  cursor: pointer; font: inherit; font-size: 12.5px; text-decoration: underline; }

/* ---------- Forms ---------- */
.field { display: block; margin-bottom: 12px; }
.field > label { display: block; font-size: 12px; font-weight: 500; color: var(--ink-2);
  margin-bottom: 5px; }
.field .hint { font-size: 11px; color: var(--muted); margin-top: 4px; }
input[type=text], input[type=email], input[type=password], input[type=number],
input[type=date], input[type=search], select, textarea {
  width: 100%; border: 1px solid var(--line); background: var(--card); border-radius: var(--r);
  padding: 10px 12px; font: inherit; font-size: 13px; color: var(--ink); outline: 0;
}
input:focus, select:focus, textarea:focus { border-color: var(--brand-500);
  box-shadow: 0 0 0 3px rgba(11,36,71,.13); }
textarea { min-height: 90px; resize: vertical; }
.form-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 0 14px; }
input[type=range] { width: 100%; accent-color: var(--brand); }
.check { display: flex; align-items: center; gap: 8px; font-size: 13px; }
.check input { width: auto; }

/* ---------- Calculated allocation (guaranteed salary → per-task share) ---------- */
.alloc-box { border: 1px dashed var(--line); border-radius: var(--r-lg); background: var(--bg-soft, #F6F8FB);
  padding: 12px; }
.alloc-figure { font-size: 22px; font-weight: 650; color: var(--brand); letter-spacing: -.4px;
  margin: 4px 0 2px; }
.sep { height: 1px; background: var(--line); margin: 10px 0; }

/* ---------- Progress ---------- */
.prog { height: 7px; border-radius: 99px; background: #E4E9F2; overflow: hidden; }
.prog > i { display: block; height: 100%; border-radius: 99px; background: var(--brand);
  transition: width .3s ease; }
.prog.amber > i { background: var(--amber); }
.prog.red > i { background: var(--red); }
.prog-label { display: flex; justify-content: space-between; font-size: 11.5px;
  color: var(--muted); margin-bottom: 4px; }

/* ---------- Lists ---------- */
.list { display: grid; gap: 10px; }
.list-item { display: flex; gap: 12px; align-items: flex-start; padding: 12px;
  border: 1px solid var(--line); border-radius: var(--r-lg); background: var(--card); }
.list-item.flat { border: 0; padding: 10px 0; border-radius: 0; border-bottom: 1px solid var(--line); }
.list-item:last-child.flat { border-bottom: 0; }
.li-title { font-size: 13.5px; font-weight: 500; }
.li-sub { font-size: 11.5px; color: var(--muted); }
.avatar { width: 34px; height: 34px; border-radius: 50%; background: var(--brand-soft);
  color: var(--brand); display: grid; place-items: center; font-size: 12px; font-weight: 600;
  flex: 0 0 auto; overflow: hidden; }
.avatar img { width: 100%; height: 100%; object-fit: cover; }
.avatar.sm { width: 26px; height: 26px; font-size: 10.5px; }
.stack { display: flex; }
.stack .avatar { margin-left: -8px; border: 2px solid var(--card); }
.stack .avatar:first-child { margin-left: 0; }

.empty { text-align: center; padding: 28px 12px; color: var(--muted); }
.empty .e-ico { font-size: 26px; opacity: .5; }
.empty .e-title { font-weight: 500; color: var(--ink-2); margin-top: 6px; }

/* task card */
.task-card { border: 1px solid var(--line); border-radius: var(--r-lg); padding: 14px;
  background: var(--card); display: grid; gap: 10px; }
.task-card.priority { border-color: #FDA29B; background: #FFFBFA; }
.task-card .t-head { display: flex; justify-content: space-between; gap: 10px; }
.task-card .t-title { font-size: 14px; font-weight: 600; }
.task-card .t-meta { font-size: 11.5px; color: var(--muted); display: flex; flex-wrap: wrap; gap: 10px; }
.task-actions { display: flex; flex-wrap: wrap; gap: 6px; }

/* segmented tabs */
.tabs { display: inline-flex; background: #EAEFF7; border-radius: 99px; padding: 3px; gap: 2px; }
.tabs button { border: 0; background: transparent; padding: 7px 14px; border-radius: 99px;
  font: inherit; font-size: 12.5px; color: var(--ink-2); cursor: pointer; }
.tabs button.active { background: var(--card); color: var(--ink); font-weight: 500;
  box-shadow: 0 1px 2px rgba(0,0,0,.06); }

/* ---------- Drawer ---------- */
.drawer { position: fixed; top: 0; right: 0; bottom: 0; width: 380px; max-width: 92vw;
  background: var(--card); border-left: 1px solid var(--line); box-shadow: var(--shadow-lg);
  z-index: 60; display: flex; flex-direction: column; }
.drawer-head { display: flex; align-items: center; justify-content: space-between;
  padding: 16px 18px; border-bottom: 1px solid var(--line); }
.drawer-body { padding: 12px 18px 24px; overflow-y: auto; }
.note { display: flex; gap: 10px; padding: 11px 0; border-bottom: 1px solid var(--line); }
.note.unread { background: var(--brand-softer); margin: 0 -18px; padding: 11px 18px; }
.note .n-dot { width: 8px; height: 8px; border-radius: 50%; margin-top: 6px; flex: 0 0 auto; }
.n-dot.info { background: var(--blue); } .n-dot.success { background: var(--green); }
.n-dot.warn { background: var(--amber); } .n-dot.danger { background: var(--red); }

/* ---------- Modal ---------- */
.modal-wrap { position: fixed; inset: 0; z-index: 70; display: grid; place-items: center; padding: 18px; }
.modal-backdrop { position: absolute; inset: 0; background: rgba(9,20,38,.48); }
.modal { position: relative; background: var(--card); border-radius: var(--r-xl);
  width: 100%; max-width: 560px; max-height: 88vh; display: flex; flex-direction: column;
  box-shadow: var(--shadow-lg); }
.modal.wide { max-width: 860px; }
.modal-head { display: flex; align-items: center; justify-content: space-between;
  padding: 18px 20px; border-bottom: 1px solid var(--line); }
.modal-body { padding: 18px 20px; overflow-y: auto; }
.modal-foot { padding: 14px 20px; border-top: 1px solid var(--line); display: flex;
  justify-content: flex-end; gap: 8px; flex-wrap: wrap; }

/* ---------- Toasts / busy ---------- */
.toasts { position: fixed; bottom: 18px; right: 18px; z-index: 90; display: grid; gap: 8px; }
.toast { background: var(--ink); color: #fff; padding: 11px 16px; border-radius: var(--r);
  font-size: 13px; box-shadow: var(--shadow-lg); max-width: 380px;
  animation: pop .18s ease; }
.toast.good { background: var(--green); } .toast.bad { background: var(--red); }
.toast.warn { background: var(--amber); }
@keyframes pop { from { transform: translateY(8px); opacity: 0; } }
.busy { position: fixed; inset: 0; background: rgba(245,247,250,.6); z-index: 80;
  display: grid; place-items: center; }
.spinner { width: 34px; height: 34px; border-radius: 50%; border: 3px solid var(--bar-soft);
  border-top-color: var(--brand); animation: spin .8s linear infinite; }
.spinner.sm { width: 16px; height: 16px; border-width: 2px; display: inline-block;
  vertical-align: -3px; border-top-color: currentColor; }
@keyframes spin { to { transform: rotate(360deg); } }

/* ---------- Upload drop ---------- */
.drop { border: 1.5px dashed var(--bar-soft); border-radius: var(--r-lg); padding: 22px;
  text-align: center; background: var(--brand-softer); cursor: pointer; }
.drop.over { border-color: var(--brand); background: var(--brand-soft); }
.drop .d-ico { font-size: 24px; }
