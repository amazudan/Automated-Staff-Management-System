<script>
/* ==========================================================================
   AdminDashboard.html — window.AdminUI
   The administrator's module. Consumed by Scripts.html (App.mountModule).
   Contract expected by the shell:
     AdminUI.nav          = [{group, items:[{id,label,icon,count}]}]
     AdminUI.views        = { id: {title, sub, render(mount)} }
     AdminUI.defaultView  = 'dashboard'
   NOTE: this file is included BEFORE Scripts.html, so window.UI / window.App
   do not exist while this IIFE runs. Never touch UI.* / App.* at load time —
   only inside functions, which run after boot.
   ========================================================================== */
(function () {
  'use strict';

  /* ---- module-local caches (per session) ---- */
  var _tasks = {};        // taskId -> mapTask_  (for modal look-ups)
  var _pay = {};          // payrollId -> row    (for payroll actions)
  var _assignable = null; // cached active staff for the "assign to" pickers

  /* ---------- tiny helpers (all reference UI/App lazily) ---------- */
  function esc(s) { return UI.esc(s); }
  function money(n) { return UI.money(n); }

  function field(label, inner, hint) {
    return '<div class="field">' +
      (label ? '<label>' + esc(label) + '</label>' : '') + inner +
      (hint ? '<div class="hint">' + esc(hint) + '</div>' : '') + '</div>';
  }

  function opt(list, sel) {
    return (list || []).map(function (o) {
      var v = (o && o.value !== undefined) ? o.value : o;
      var t = (o && o.label !== undefined) ? o.label : o;
      return '<option value="' + esc(v) + '"' +
        (String(v) === String(sel) ? ' selected' : '') + '>' + esc(t) + '</option>';
    }).join('');
  }

  function actBtn(label, act, id, cls) {
    return '<button class="btn xs ' + (cls || '') + '" data-act="' + act +
      '" data-id="' + esc(id || '') + '">' + esc(label) + '</button>';
  }

  function spacer(h) { return '<div style="height:' + (h || 16) + 'px"></div>'; }

  // Single delegated click handler per view. Replaces the previous view's
  // handler so listeners never stack on the persistent #view element.
  function bind(mount, handlers) {
    if (mount.__act) mount.removeEventListener('click', mount.__act);
    var fn = function (e) {
      var n = e.target.closest('[data-act]');
      if (!n || !mount.contains(n)) return;
      var h = handlers[n.getAttribute('data-act')];
      if (h) { e.preventDefault(); h(n.getAttribute('data-id'), n); }
    };
    mount.__act = fn;
    mount.addEventListener('click', fn);
  }

  function remember(list) {
    (list || []).forEach(function (t) { if (t && t.taskId) _tasks[t.taskId] = t; });
    return list;
  }

  // Resolve a task object by id, fetching detail if we do not have it cached.
  function withTask(id) {
    if (_tasks[id]) return Promise.resolve(_tasks[id]);
    return App.api('api_taskDetail', id).then(function (d) {
      _tasks[d.task.taskId] = d.task; return d.task;
    });
  }

  function loadAssignable(force) {
    if (_assignable && !force) return Promise.resolve(_assignable);
    return App.api('api_staffList').then(function (list) {
      _assignable = list.filter(function (s) { return s.status !== 'Inactive' && !s.suspended; });
      return _assignable;
    });
  }

  // Standard form-submit action: validation may `return;` (modal stays open),
  // success closes manually. close:false + keepOpen:true keeps the modal open
  // on validation return and on API rejection (App.modal re-enables the button).
  function submit(label, fn, tone) {
    return { label: label, tone: tone || 'brand', close: false, keepOpen: true, onClick: fn };
  }

  /* ======================================================================
     TASK MODALS
     ====================================================================== */
  function taskFormBody(task, staff, mode) {
    var cfg = App.state.config, t = task || {};
    var manual = cfg.autoAllocateFromSalary === false;
    var assignSection = mode === 'create'
      ? field('Assign to',
          '<div style="max-height:190px;overflow:auto;border:1px solid var(--line);border-radius:12px;padding:8px;display:grid;gap:2px">' +
          staff.map(function (s) {
            return '<label class="check"><input type="checkbox" name="assignTo" value="' + esc(s.staffId) + '">' +
              '<span>' + esc(s.name) + ' <span class="muted small">· ' + esc(s.department || s.role) +
              (s.monthlySalary ? ' · ' + money(s.monthlySalary) + '/month' : ' · no salary set') +
              '</span></span></label>';
          }).join('') + '</div>',
          'Pick one or more people. Assigning to several creates one copy each.')
      : field('Assignee',
          '<select data-field="assignedTo">' +
          opt(staff.map(function (s) { return { value: s.staffId, label: s.name + ' · ' + (s.department || s.role) }; }), t.assignedTo) +
          '</select>');

    // Requirement: no manual allocation. The amount is derived from the
    // assignee's guaranteed monthly salary, so the form previews it instead of
    // asking for it.
    var moneySection = manual
      ? field('Amount allocated (' + esc(cfg.currency || '') + ')',
          '<input type="number" data-field="amountAllocated" data-type="number" min="0" step="0.01" value="' +
          (t.amountAllocated != null ? t.amountAllocated : '') + '" placeholder="0">')
      : field('Allocation (calculated)',
          '<div id="allocBox" class="alloc-box"><div class="muted small">Pick who this is for to see the calculated allocation.</div></div>',
          'The guaranteed monthly salary is shared across the tasks due that month; this task then pays out on its completion percentage.');

    return '' +
      field('Title', '<input type="text" data-field="title" value="' + esc(t.title || '') + '" placeholder="e.g. Prepare Q3 deck">') +
      field('Description', '<textarea data-field="description" placeholder="What needs doing?">' + esc(t.description || '') + '</textarea>') +
      '<div class="form-2">' +
        field('Type', '<select data-field="taskType">' + opt(cfg.taskTypes, t.taskType || 'Daily') + '</select>') +
        field('Priority', '<select data-field="priority">' + opt(cfg.priorities, t.priority || 'Normal') + '</select>') +
      '</div>' +
      '<div class="form-2">' +
        field('Start date', '<input type="date" data-field="startDate" value="' + esc(t.startDate || cfg.today) + '">') +
        field('Due date', '<input type="date" data-field="dueDate" value="' + esc(t.dueDate || '') + '">') +
      '</div>' +
      assignSection +
      moneySection;
  }

  /* Render one api_allocationPreview row. */
  function allocPreviewHtml(list) {
    if (!list || !list.length) {
      return '<div class="muted small">Pick who this is for to see the calculated allocation.</div>';
    }
    return list.map(function (p) {
      if (p.error) return '<div class="small"><b>' + esc(p.staffId) + '</b>: ' + esc(p.error) + '</div>';
      if (!p.guaranteed) {
        return '<div class="small"><b>' + esc(p.staffName) + '</b> has no guaranteed monthly salary yet, so this task would carry ' +
          money(0) + '. Set their salary on the Staff tab first.</div>';
      }
      var others = (p.others || []).slice(0, 4).map(function (o) {
        return '<div class="li-sub">' + esc(o.title) + ' · ' + money(o.share) +
          (o.stored !== o.share ? ' <span class="muted">(was ' + money(o.stored) + ')</span>' : '') + '</div>';
      }).join('');
      var more = (p.others || []).length > 4 ? '<div class="li-sub">+ ' + ((p.others || []).length - 4) + ' more</div>' : '';
      return '<div class="small">' +
        '<div><b>' + esc(p.staffName) + '</b> · ' + money(p.guaranteed) + ' guaranteed for ' + esc(p.monthLabel) + '</div>' +
        '<div class="alloc-figure">' + money(p.thisShare) + '</div>' +
        '<div class="li-sub">' + money(p.guaranteed) + ' ÷ ' + p.taskCount + ' task' + (p.taskCount === 1 ? '' : 's') +
          ' due in ' + esc(p.monthLabel) + (p.mode === 'Weighted' ? ' (weighted by priority)' : '') + '</div>' +
        '<div class="li-sub">Pays out on this task’s validated completion percentage.</div>' +
        (p.locked ? '<div class="li-sub">⚠ ' + esc(p.monthLabel) + ' payroll is already approved or paid — existing shares stay frozen.</div>' : '') +
        (others ? '<div style="margin-top:6px"><div class="li-sub"><b>Other tasks that month</b></div>' + others + more + '</div>' : '') +
        '</div>';
    }).join('<div class="sep"></div>');
  }

  /* Keep the calculated allocation in step with the form. */
  function wireAllocPreview(root, mode, taskId) {
    var box = root.querySelector('#allocBox');
    if (!box) return;
    var timer = null;

    function chosen() {
      if (mode === 'create') {
        return Array.prototype.slice.call(root.querySelectorAll('input[name="assignTo"]:checked'))
          .map(function (x) { return x.value; });
      }
      var sel = root.querySelector('[data-field="assignedTo"]');
      return sel && sel.value ? [sel.value] : [];
    }

    function run() {
      var ids = chosen();
      if (!ids.length) {
        box.innerHTML = '<div class="muted small">Pick who this is for to see the calculated allocation.</div>';
        return;
      }
      var due = root.querySelector('[data-field="dueDate"]');
      var pri = root.querySelector('[data-field="priority"]');
      box.innerHTML = '<div class="muted small">Calculating…</div>';
      App.api('api_allocationPreview', {
        staffIds: ids.slice(0, 8),
        dueDate: due ? due.value : '',
        priority: pri ? pri.value : 'Normal',
        taskId: taskId || ''
      }).then(function (list) {
        box.innerHTML = allocPreviewHtml(list) +
          (ids.length > 8 ? '<div class="li-sub">Showing the first 8 of ' + ids.length + ' people.</div>' : '');
      }).catch(function (e) {
        box.innerHTML = '<div class="muted small">' + esc(e.message) + '</div>';
      });
    }

    root.addEventListener('change', function (e) {
      var f = e.target.getAttribute ? e.target.getAttribute('data-field') : '';
      if (e.target.name === 'assignTo' || f === 'assignedTo' || f === 'dueDate' || f === 'priority') {
        clearTimeout(timer);
        timer = setTimeout(run, 120);
      }
    });
    run();
  }

  function openTaskCreate() {
    App.busy(true);
    loadAssignable().then(function (staff) {
      App.busy(false);
      if (!staff.length) { App.toast('Add an active staff member first.', 'warn'); return; }
      App.modal({
        title: 'New task', wide: true,
        body: taskFormBody(null, staff, 'create'),
        onOpen: function (root) { wireAllocPreview(root, 'create', ''); },
        actions: [
          { label: 'Cancel' },
          submit('Create task', function (c) {
            var v = c.values();
            var assignTo = Array.prototype.slice.call(
              c.root.querySelectorAll('input[name="assignTo"]:checked')).map(function (x) { return x.value; });
            if (!(v.title && v.title.trim())) { App.toast('Enter a title.', 'warn'); return; }
            if (!assignTo.length) { App.toast('Select at least one person.', 'warn'); return; }
            return App.api('api_taskCreate', {
              title: v.title, description: v.description, taskType: v.taskType, priority: v.priority,
              startDate: v.startDate, dueDate: v.dueDate, amountAllocated: v.amountAllocated, assignTo: assignTo
            }).then(function () {
              App.closeModal();
              App.toast(assignTo.length > 1 ? ('Created for ' + assignTo.length + ' staff.') : 'Task created.', 'good');
              App.refresh();
            });
          })
        ]
      });
    }).catch(function (e) { App.busy(false); App.toast(e.message, 'bad'); });
  }

  function openTaskEdit(task) {
    loadAssignable().then(function (staff) {
      App.modal({
        title: 'Edit task', wide: true,
        body: taskFormBody(task, staff, 'edit'),
        onOpen: function (root) { wireAllocPreview(root, 'edit', task.taskId); },
        actions: [
          { label: 'Cancel' },
          submit('Save changes', function (c) {
            var v = c.values();
            if (!(v.title && v.title.trim())) { App.toast('Enter a title.', 'warn'); return; }
            return App.api('api_taskUpdate', {
              taskId: task.taskId, title: v.title, description: v.description, priority: v.priority,
              taskType: v.taskType, amountAllocated: v.amountAllocated, startDate: v.startDate,
              dueDate: v.dueDate, assignedTo: v.assignedTo
            }).then(function () { App.closeModal(); App.toast('Task updated.', 'good'); App.refresh(); });
          })
        ]
      });
    });
  }

  function openTaskDetail(id) {
    App.busy(true);
    App.api('api_taskDetail', id).then(function (d) {
      App.busy(false);
      var t = d.task; _tasks[t.taskId] = t;
      var al = d.allocation;

      var summary = '' +
        '<div class="grid g-2" style="gap:14px">' +
          '<div>' +
            '<div class="wrap" style="margin-bottom:10px">' + UI.taskPill(t.status) + ' ' + UI.priorityPill(t.priority) +
              ' ' + UI.pill(t.taskType, 'outline') +
              (t.isPriority ? ' ' + UI.pill('Priority', 'red') : '') +
              (t.overdue ? ' ' + UI.pill('Overdue', 'red') : '') + '</div>' +
            '<div class="li-sub">Assignee</div><div class="li-title" style="margin-bottom:8px">' + esc(t.assignedToName) + '</div>' +
            '<div class="li-sub">Due</div><div class="li-title" style="margin-bottom:8px">' + esc(t.dueLabel || t.dueDate || '—') +
              (t.rolloverCount ? ' · rolled over ' + t.rolloverCount + '×' : '') + '</div>' +
            (t.description ? '<div class="li-sub">Description</div><div style="margin-bottom:8px">' + esc(t.description) + '</div>' : '') +
          '</div>' +
          '<div>' +
            UI.kpi({ label: 'Reported', value: UI.pct(t.reportedProgress) }) + spacer(10) +
            UI.kpi({ label: 'Validated (pays)', value: UI.pct(t.validatedProgress),
              foot: money(t.payable) + ' earned of ' + money(t.amountAllocated) }) +
          '</div>' +
        '</div>' +
        (al && al.enabled && al.guaranteed
          ? '<div class="notice mt small"><div><b>Allocation</b> — ' + money(al.share) + ' of ' +
            esc(t.assignedToName) + '’s ' + money(al.guaranteed) + ' guarantee for ' + esc(al.monthLabel) +
            ', shared across ' + al.taskCount + ' task' + (al.taskCount === 1 ? '' : 's') + ' due that month' +
            (al.mode === 'Weighted' ? ' (weighted by priority)' : '') + '. ' +
            money(al.payable) + ' earned at ' + UI.pct(t.effectiveProgress) + ' validated completion.' +
            (al.locked ? ' This month’s payroll is already approved or paid, so the share is frozen.' : '') +
            '</div></div>'
          : '') +
        (t.adminComment ? '<div class="notice mt small"><div><b>Last note:</b> ' + esc(t.adminComment) + '</div></div>' : '');

      var reps = (d.reports || []).length ? d.reports.map(function (r) {
        return '<div class="list-item flat"><div style="flex:1;min-width:0">' +
          '<div class="li-title">' + esc(r.reportDate) + ' · ' + UI.pct(r.progressPercent) + ' ' +
          (r.onTime ? UI.pill('On time', 'green') : UI.pill('Late', 'amber')) + ' ' + UI.reviewPill(r.reviewStatus) + '</div>' +
          '<div class="li-sub">' + esc(r.reportText) + '</div>' +
          (r.blockers ? '<div class="li-sub">⛔ ' + esc(r.blockers) + '</div>' : '') +
          '</div></div>';
      }).join('') : UI.empty('📝', 'No daily reports yet');

      var docs = (d.documents || []).length ? d.documents.map(function (u) {
        return '<div class="file-row"><span class="file-ico">📄</span>' +
          '<div style="flex:1;min-width:0"><strong>' + esc(u.fileName) + '</strong>' +
          '<div class="muted small">' + esc(u.category) + ' · ' + u.sizeKb + ' KB · ' + esc(u.uploadedAt) + '</div></div>' +
          '<a class="btn xs" href="' + esc(u.url) + '" target="_blank" rel="noopener">Open</a></div>';
      }).join('') : '<div class="muted small">No documents attached.</div>';

      var actions = [{ label: 'Close' }];
      if (t.status === 'PendingValidation') {
        actions.unshift({ label: 'Reject', tone: 'danger', close: false, onClick: function () { openReject(t); } });
        actions.unshift({ label: 'Validate', tone: 'brand', close: false, onClick: function () { openValidate(t); } });
      } else if (t.status !== 'Completed' && t.status !== 'Failed' && t.status !== 'Cancelled') {
        actions.unshift({ label: 'Upload file', close: false, onClick: function () { App.openUpload({ taskId: t.taskId, taskTitle: t.title }); } });
        actions.unshift({ label: 'Edit', tone: 'brand', close: false, onClick: function () { openTaskEdit(t); } });
      }
      // A failed task can be reassigned (and reactivated) to another staff
      // member; any open task can simply change hands.
      if (t.status !== 'Completed' && t.status !== 'Cancelled') {
        actions.unshift({ label: t.status === 'Failed' ? 'Reassign / retry' : 'Reassign',
          close: false, onClick: function () { openReassign(t); } });
      }

      App.modal({
        title: t.title, wide: true,
        body: summary + spacer(14) +
          UI.card({ title: 'Daily reports', className: 'tight', body: reps }) + spacer(12) +
          UI.card({ title: 'Documents', className: 'tight', body: docs }),
        actions: actions
      });
    }).catch(function (e) { App.busy(false); App.toast(e.message, 'bad'); });
  }

  function openValidate(task) {
    App.modal({
      title: 'Validate — ' + task.title,
      body: '' +
        '<p class="muted small">Staff reported <b>' + UI.pct(task.reportedProgress) +
          '</b>. Set the completion percentage you are validating — that is what pays.</p>' +
        field('Validated progress %',
          '<input type="number" data-field="validatedProgress" data-type="number" min="0" max="100" value="' + (task.reportedProgress || 0) + '">') +
        '<div class="form-2">' +
          field('Quality rating (0–100)',
            '<input type="number" data-field="rating" data-type="number" min="0" max="100" value="' + (task.adminRating != null ? task.adminRating : 80) + '">') +
          field('Close out',
            '<label class="check" style="margin-top:8px"><input type="checkbox" data-field="markComplete" checked> <span>Mark task completed</span></label>') +
        '</div>' +
        field('Comment to staff', '<textarea data-field="comment" placeholder="Optional feedback">' + esc(task.adminComment || '') + '</textarea>') +
        '<div class="hint">Unticking “Mark task completed” records partial validated progress and returns the task to In progress, so the staff member keeps earning toward the balance.</div>',
      actions: [
        { label: 'Cancel' },
        { label: 'Reject instead', tone: 'danger', close: false, onClick: function () { openReject(task); } },
        submit('Save validation', function (c) {
          var v = c.values();
          return App.api('api_taskValidate', {
            taskId: task.taskId, validatedProgress: v.validatedProgress, rating: v.rating,
            comment: v.comment, markComplete: v.markComplete
          }).then(function (r) {
            App.closeModal();
            App.toast('Validated ' + UI.pct(r.validatedProgress) + ' · ' + money(r.payableAmount) + ' earned.', 'good');
            App.refresh();
          });
        })
      ]
    });
  }

  function openReject(task) {
    App.modal({
      title: 'Reject — ' + task.title,
      body: '<p class="muted small">This returns the task to <b>In progress</b> with no pay released.</p>' +
        field('Reason / what to fix', '<textarea data-field="comment" placeholder="Explain what needs rework"></textarea>'),
      actions: [
        { label: 'Cancel' },
        submit('Reject & return', function (c) {
          var v = c.values();
          if (!(v.comment && v.comment.trim())) { App.toast('Add a short reason.', 'warn'); return; }
          return App.api('api_taskReject', { taskId: task.taskId, comment: v.comment })
            .then(function () { App.closeModal(); App.toast('Sent back for rework.', 'good'); App.refresh(); });
        }, 'danger')
      ]
    });
  }

  function openReassign(task) {
    if (!task) return;
    var willReactivate = task.status === 'Failed' || task.status === 'Completed';
    App.busy(true);
    loadAssignable().then(function (list) {
      App.busy(false);
      var options = (list || []).filter(function (s) {
        return s.staffId !== task.assignedTo;
      }).map(function (s) { return { value: s.staffId, label: s.name + (s.department ? ' · ' + s.department : '') }; });
      if (!options.length) { App.toast('No other active staff to reassign to.', 'warn'); return; }
      var today = App.state.config.today;
      App.modal({
        title: 'Reassign — ' + task.title,
        body:
          '<div class="li-sub" style="margin-bottom:8px">Currently assigned to <b>' + esc(task.assignedToName) +
            '</b> · ' + UI.taskPill(task.status) + '</div>' +
          field('Reassign to', '<select data-field="staffId">' + opt(options) + '</select>') +
          field('New due date', '<input type="date" data-field="dueDate" value="' + esc(today) + '">',
            'The new owner’s deadline. Handy when reactivating a task whose date has passed.') +
          '<label class="check" style="margin-top:6px"><input type="checkbox" data-field="reactivate"' +
            (willReactivate ? ' checked' : '') +
            '><span>Reactivate — reset progress and start fresh for the new owner</span></label>' +
          (willReactivate
            ? '<div class="notice small" style="margin-top:8px">This task is <b>' + esc(task.status) +
              '</b>. Reassigning sets it back to <b>Assigned</b> for the new owner.</div>'
            : ''),
        actions: [
          { label: 'Cancel' },
          submit('Reassign', function (c) {
            var v = c.values();
            if (!v.staffId) { App.toast('Choose a staff member.', 'warn'); return; }
            return App.api('api_taskReassign', {
              taskId: task.taskId, staffId: v.staffId, dueDate: v.dueDate, reactivate: !!v.reactivate
            }).then(function (r) {
              App.closeModal();
              App.toast('Task reassigned to ' + (r.assignedToName || 'staff') +
                (r.reactivated ? ' and reactivated.' : '.'), 'good');
              App.refresh();
            });
          })
        ]
      });
    }).catch(function (e) { App.busy(false); App.toast(e && e.message ? e.message : String(e), 'bad'); });
  }

  function reviewReport(reportId, decision) {
    if (decision === 'Approved') {
      return App.api('api_dailyReportReview', { reportId: reportId, decision: 'Approved', comment: '' })
        .then(function () { App.toast('Report approved.', 'good'); App.refresh(); })
        .catch(function (e) { App.toast(e.message, 'bad'); });
    }
    App.confirm({
      title: 'Reject daily report', message: 'Send this report back to the staff member?',
      note: true, noteLabel: 'Reason', requireNote: true, confirmLabel: 'Reject', tone: 'danger'
    }).then(function (note) {
      if (note === null) return;
      App.api('api_dailyReportReview', { reportId: reportId, decision: 'Rejected', comment: note })
        .then(function () { App.toast('Report rejected.', 'good'); App.refresh(); })
        .catch(function (e) { App.toast(e.message, 'bad'); });
    });
  }

  /* ======================================================================
     STAFF MODALS
     ====================================================================== */
  function staffFormBody(s) {
    var roles = ['Staff', 'Manager', 'Admin']; s = s || {};
    var cfg = App.state.config || {};
    var salary = s.monthlySalary != null && s.monthlySalary !== ''
      ? s.monthlySalary
      : (cfg.defaultMonthlySalary || '');
    return '' +
      '<div class="form-2">' +
        field('Full name', '<input type="text" data-field="name" value="' + esc(s.name || '') + '" placeholder="Jane Doe">') +
        field('Work email', '<input type="email" data-field="email" value="' + esc(s.email || '') + '" placeholder="jane@company.com">') +
      '</div>' +
      '<div class="form-2">' +
        field('Role', '<select data-field="role">' + opt(roles, s.role || 'Staff') + '</select>') +
        field('Phone', '<input type="text" data-field="phone" value="' + esc(s.phone || '') + '" placeholder="Optional">') +
      '</div>' +
      '<div class="form-2">' +
        field('Department', '<input type="text" data-field="department" value="' + esc(s.department || '') + '" placeholder="e.g. Operations">') +
        field('Position', '<input type="text" data-field="position" value="' + esc(s.position || '') + '" placeholder="e.g. Analyst">') +
      '</div>' +
      field('Guaranteed monthly salary (' + esc(cfg.currency || '') + ')',

  function bucketCard(key, tasks) {
    var meta = {
      completed: { icon: '✅', title: 'Completed', view: 'tasks' },
      pending: { icon: '🕵️', title: 'Yet to validate', view: 'validation' },
      inProgress: { icon: '🔧', title: 'In progress', view: 'tasks' }
    }[key];
    var body = tasks.length ? tasks.slice(0, 6).map(taskListItem).join('') : UI.empty('—', 'Nothing here');
    var more = tasks.length > 6 ? actBtn('View all ' + tasks.length, 'go', meta.view) : '';
    return UI.card({
      title: meta.icon + ' ' + meta.title,
      sub: tasks.length + ' task' + (tasks.length === 1 ? '' : 's'),
      actions: more, body: body
    });
  }

  views.tasks = {
    title: 'Tasks', sub: 'Everything assigned across the team',
    render: function (mount) {
      return App.api('api_taskList', {}).then(function (list) {
        remember(list);
        var tab = 'all';
        var tabs = [['all', 'All'], ['inProgress', 'In progress'], ['pending', 'Yet to validate'],
          ['completed', 'Completed'], ['scheduled', 'Scheduled'], ['failed', 'Failed']];
        function match(t) {
          if (tab === 'all') return true;
          if (tab === 'scheduled') return t.status === 'Scheduled';
          if (tab === 'failed') return t.status === 'Failed';
          return t.bucket === tab;
        }
        function draw() {
          var rows = list.filter(match);
          var table = Perf.paginatedTable({
            pageSize: 50,
            rows: rows,
            cols: [
              { label: 'Task', render: function (t) {
                return '<div><div class="li-title">' + esc(t.title) + '</div><div class="li-sub">' +
                  esc(t.taskType) + (t.isPriority ? ' · ' + UI.pill('Priority', 'red') : '') + '</div></div>';
              } },
              { label: 'Assignee', render: function (t) {
                return '<div class="row-gap">' + UI.avatar({ name: t.assignedToName }, 'sm') + '<span>' + esc(t.assignedToName) + '</span></div>';
              } },

  /**
   * Repair pass: back-fill validated progress from daily reports that were
   * already approved before the "approval releases pay" fix existed. Only ever
   * raises a task's validated %, so it is safe to run repeatedly.
   */
  function syncApprovedReports() {
    App.confirm({
      title: 'Sync approved reports',
      message: 'Re-check every task against its approved daily reports and raise its ' +
               'validated % (and earnings) to match the highest approved report. ' +
               'This never lowers a value and never touches approved or paid payroll.',
      confirmLabel: 'Sync now'
    }).then(function (ok) {
      if (!ok) return;
      App.busy(true);
      App.api('api_taskSyncValidated', {})
        .then(function (r) {
          App.busy(false);
          r = r || {};
          if (r.updated) {
            App.toast('Synced — ' + r.updated + ' task(s) updated from ' + r.scanned + ' checked. ' +
              'Re-run payroll to see the new earnings.', 'good');
          } else {
            App.toast('Nothing to update — all ' + (r.scanned || 0) + ' task(s) already match their approved reports.', 'good');
          }
          App.refresh();
        })
        .catch(function (e) { App.busy(false); App.toast(e.message, 'bad'); });
    });
  }

        .then(function (r) {

          if (r && r.skipped) { App.toast(r.skipped, 'bad'); return; }
          App.toast('Allocations recalculated — ' + (r.written || 0) + ' task amount(s) updated across ' +
            (r.months || 0) + ' month(s).', 'good');

          return '<button class="btn sm" data-act="auto" data-id="' + a[0] + '">' + esc(a[1]) + '</button>';
        }).join('') + '</div>';

        var info = '<div class="li-sub">Timezone</div><div class="li-title" style="margin-bottom:8px">' + esc(d.timezone || '—') + '</div>' +
          '<div class="li-sub">Spreadsheet ID</div><div class="mono small" style="margin-bottom:8px;word-break:break-all">' + esc(d.spreadsheetId || '—') + '</div>' +
          '<div class="li-sub">Web app URL</div><div class="small" style="word-break:break-all">' +
          (d.webAppUrl ? '<a href="' + esc(d.webAppUrl) + '" target="_blank" rel="noopener">' + esc(d.webAppUrl) + '</a>' : '—') + '</div>';

        mount.innerHTML = '<div class="spread" style="margin-bottom:14px"><div class="wrap">' +
          UI.pill((d.rows || []).length + ' settings', 'grey') +
          '</div><button class="btn btn-brand" data-act="savecfg">Save settings</button></div>' +
          UI.grid('g-2-1', '<div>' + cfgHtml + '</div>' + UI.card({ title: 'Workspace', body: info })) +
          spacer() +
          UI.card({ title: 'Automation', sub: 'Run a job now (they also run on schedule)', actions: actBtn('Install/repair triggers', 'install'), body: autoBody }) +
          spacer() +
          UI.card({ title: 'System logs', sub: 'Most recent first', actions: actBtn('Refresh logs', 'logs'),
            body: '<div id="logBox"><div class="muted small">Tap “Refresh logs” to load.</div></div>' });

        bind(mount, {
          savecfg: function () {
            var updates = {};
            mount.querySelectorAll('[data-cfg]').forEach(function (n) {
              var key = n.getAttribute('data-cfg');
              var orig = (d.rows.find(function (r) { return r.key === key; }) || {}).value;
              if (String(n.value) !== String(orig)) updates[key] = n.value;
            });
            if (!Object.keys(updates).length) { App.toast('No changes to save.', 'warn'); return; }
            App.api('api_configSave', { updates: updates })
              .then(function (r) { App.toast('Saved ' + (r.applied != null ? r.applied : Object.keys(updates).length) + ' setting(s).', 'good'); App.refresh(); })
              .catch(function (e) { App.toast(e.message, 'bad'); });
          },
          install: function () {
            App.confirm({ title: 'Install triggers', message: 'Install / repair all time-driven automation triggers? This replaces existing copies.', confirmLabel: 'Install' })
              .then(function (ok) {
                if (!ok) return;
                App.busy(true);
                App.api('api_installTriggers').then(function (r) {
                  App.busy(false); App.toast('Installed ' + (r.installed != null ? r.installed : '') + ' trigger(s).', 'good'); App.refresh();
                }).catch(function (e) { App.busy(false); App.toast(e.message, 'bad'); });
              });
          },
          auto: function (id) {
            App.busy(true);
            App.api('api_runAutomation', { name: id }).then(function () { App.busy(false); App.toast('Ran ' + id + '.', 'good'); })
              .catch(function (e) { App.busy(false); App.toast(e.message, 'bad'); });
          },
          logs: function () {
            var box = mount.querySelector('#logBox');
            box.innerHTML = '<div class="empty"><div class="spinner"></div></div>';
            App.api('api_logs', { limit: 100 }).then(function (rows) {
              box.innerHTML = rows.length ? UI.table({
                cols: [
                  { label: 'Time', render: function (l) { return esc(l.timestamp); } },
                  { label: 'Level', render: function (l) { return UI.pill(l.level, l.level === 'ERROR' ? 'red' : (l.level === 'WARN' ? 'amber' : 'grey')); } },
                  { label: 'Source', render: function (l) { return esc(l.source); } },
                  { label: 'Message', render: function (l) { return esc(l.message); } }
                ],
                rows: rows
              }) : UI.empty('📜', 'No logs');
            }).catch(function (e) { box.innerHTML = UI.empty('⚠', e.message); });
          }
        });
      });
    }
  };

  /* ---------- Email (Requirement 10) ---------- */
  views.email = {
    title: 'Email', sub: 'Message staff and manage reusable templates',
    render: function (mount) {
      return App.api('api_emailData').then(function (d) {
        var audience = d.audience || { staff: [], departments: [], roles: [], total: 0 };
        var templates = d.templates || [];
        var staff = audience.staff || [];

        function recipientsFor(scope, val) {
          if (scope === 'all') return staff;
          if (scope === 'department') return staff.filter(function (s) { return s.department === val; });
          if (scope === 'role') return staff.filter(function (s) { return s.role === val; });
          if (scope === 'individual') {
            var ids = Array.isArray(val) ? val : [];
            return staff.filter(function (s) { return ids.indexOf(s.staffId) !== -1; });
          }
          return [];
        }

        var scopeOptions = [
          { value: 'all', label: 'Everyone (' + staff.length + ')' },
          { value: 'department', label: 'By department' },
          { value: 'role', label: 'By role' },
          { value: 'individual', label: 'Individual staff' }
        ];

        /* Requirement 4 — the sender line. Google only lets a script send as the
           executing account or one of its verified aliases, so say plainly which
           address will appear and what to do when the configured one cannot. */
        var snd = d.sender || {};
        var sendsAs = snd.from || snd.account || '';
        var senderNote = '<div class="notice small" style="margin:0 0 12px"><div>' +
          '<b>Sends as:</b> ' + esc(sendsAs || 'the account running this app') +
          (snd.replyTo && snd.replyTo !== sendsAs ? ' · replies go to <b>' + esc(snd.replyTo) + '</b>' : '') +
          (snd.aliasFallback
            ? '<div class="small" style="margin-top:4px">' + esc(snd.configured) + ' is not a verified Gmail alias of ' +
              esc(snd.account) + ', so it is used as the reply-to address instead. Verify it as an alias in Gmail, ' +
              'or change <b>SenderEmail</b> in Settings.</div>'
            : (snd.configured
                ? ''
                : '<div class="small" style="margin-top:4px">Set <b>SenderEmail</b> and <b>SenderName</b> in Settings ' +
                  'to send from your company address.</div>')) +
          '</div></div>';

        var composeBody = senderNote +
          field('Send to', '<select data-field="scope" id="emScope">' + opt(scopeOptions, 'all') + '</select>') +
          '<div id="emValueWrap"></div>' +
          '<div class="notice small" id="emCount" style="margin:0 0 12px"></div>' +
          field('Subject', '<input type="text" id="emSubject" placeholder="e.g. Team meeting on Friday">') +
          field('Message', '<textarea id="emBody" placeholder="Write your message here…" style="min-height:170px"></textarea>',
            'Sent as a branded email to each recipient, greeted by name. Leave a blank line between paragraphs.') +
          '<label class="check" style="margin-top:4px"><input type="checkbox" id="emSaveTpl"> ' +
          '<span>Also save this message as a reusable template</span></label>' +
          '<div id="emTplNameWrap" class="hidden" style="margin-top:10px">' +
          field('Template name', '<input type="text" id="emTplName" placeholder="e.g. Monthly reminder">') + '</div>';

        var tplBody = templates.length ? templates.map(function (t) {
          return '<div class="list-item flat"><div style="flex:1;min-width:0">' +
            '<div class="li-title">' + esc(t.name) + '</div>' +
            '<div class="li-sub">' + esc(t.subject || '(no subject)') + '</div></div>' +
            '<div class="row-gap">' + actBtn('Load', 'tpl-load', t.templateId, 'btn-brand') +
            actBtn('Delete', 'tpl-del', t.templateId, 'btn-ghost') + '</div></div>';
        }).join('') : UI.empty('✉️', 'No templates yet',
          d.templatesReady
            ? 'Compose a message and tick “save as a reusable template”.'
            : 'Run setupSystem() once in the Apps Script editor to enable saved templates.');

        mount.innerHTML = UI.grid('g-2-1',
          UI.card({ title: 'Compose', sub: audience.total + ' active staff can be emailed', body: composeBody,
            actions: '<button class="btn btn-brand" data-act="send">Send email</button>' }) +
          UI.card({ title: 'Templates', sub: templates.length + ' saved', body: '<div id="emTplList">' + tplBody + '</div>' }));

        var valueWrap = mount.querySelector('#emValueWrap');
        var countBox = mount.querySelector('#emCount');
        var scopeSel = mount.querySelector('#emScope');

        function selectedIds() {
          return Array.prototype.slice.call(mount.querySelectorAll('input[name="emStaff"]:checked'))
            .map(function (x) { return x.value; });
        }
        function currentValue() {
          var scope = scopeSel.value;
          if (scope === 'individual') return selectedIds();
          var v = mount.querySelector('#emValue');
          return v ? v.value : '';
        }
        function updateCount() {
          var n = recipientsFor(scopeSel.value, currentValue()).length;
          countBox.textContent = n + ' recipient' + (n === 1 ? '' : 's') + ' will receive this email.';
        }
        function drawValue() {
          var scope = scopeSel.value;
          if (scope === 'department') {
            valueWrap.innerHTML = field('Department', '<select id="emValue">' +
              opt(audience.departments.map(function (x) { return { value: x, label: x }; })) + '</select>');
          } else if (scope === 'role') {
            valueWrap.innerHTML = field('Role', '<select id="emValue">' +
              opt(audience.roles.map(function (x) { return { value: x, label: x }; })) + '</select>');
          } else if (scope === 'individual') {
            valueWrap.innerHTML = field('Staff',
              '<div style="max-height:210px;overflow:auto;border:1px solid var(--line);border-radius:12px;padding:8px;display:grid;gap:2px">' +
              (staff.length ? staff.map(function (s) {
                return '<label class="check"><input type="checkbox" name="emStaff" value="' + esc(s.staffId) + '"> ' +
                  '<span>' + esc(s.name) + ' <span class="muted small">· ' + esc(s.department || s.role || '—') + '</span></span></label>';
              }).join('') : '<div class="muted small">No staff available.</div>') + '</div>');
          } else {
            valueWrap.innerHTML = '';
          }
          var v = mount.querySelector('#emValue');
          if (v) v.addEventListener('change', updateCount);
          mount.querySelectorAll('input[name="emStaff"]').forEach(function (n) { n.addEventListener('change', updateCount); });
          updateCount();
        }

        scopeSel.addEventListener('change', drawValue);
        mount.querySelector('#emSaveTpl').addEventListener('change', function () {
          mount.querySelector('#emTplNameWrap').classList.toggle('hidden', !this.checked);
        });
        drawValue();

        bind(mount, {
          send: function () {
            var scope = scopeSel.value;
            var value = currentValue();
            var subject = mount.querySelector('#emSubject').value.trim();
            var body = mount.querySelector('#emBody').value.trim();
            var saveTpl = mount.querySelector('#emSaveTpl').checked;
            var tplName = saveTpl ? mount.querySelector('#emTplName').value.trim() : '';
            if (!subject) { App.toast('Enter a subject.', 'warn'); return; }
            if (!body) { App.toast('Write a message.', 'warn'); return; }
            if ((scope === 'department' || scope === 'role') && !value) { App.toast('Choose a ' + scope + '.', 'warn'); return; }
            if (scope === 'individual' && !value.length) { App.toast('Select at least one staff member.', 'warn'); return; }
            if (saveTpl && !tplName) { App.toast('Name the template, or untick “save as a reusable template”.', 'warn'); return; }
            var n = recipientsFor(scope, value).length;
            if (!n) { App.toast('That audience has no staff with an email address.', 'warn'); return; }
            App.confirm({ title: 'Send email',
              message: 'Send “' + subject + '” to ' + n + ' recipient' + (n === 1 ? '' : 's') + '?',
              confirmLabel: 'Send' }).then(function (ok) {
              if (!ok) return;
              App.busy(true);
              App.api('api_emailSend', { scope: scope, value: value, subject: subject, body: body,
                saveTemplate: saveTpl, templateName: tplName }).then(function (r) {
                App.busy(false);
                App.toast('Sent to ' + r.sent + ' of ' + r.recipients + ' recipient' +
                  (r.recipients === 1 ? '' : 's') + (r.sender ? ' as ' + r.sender : '') + '.',
                  r.failed ? 'warn' : 'good');
                // Never let a partial failure disappear — name who did not get it.
                if (r.failed && r.failures && r.failures.length) {
                  App.modal({
                    title: r.failed + ' recipient(s) did not receive it',
                    body: '<p class="muted small">Everyone else was sent “' + esc(subject) + '”. ' +
                      'These addresses failed:</p><div class="list">' +
                      r.failures.map(function (f) {
                        return '<div class="list-item flat"><div style="flex:1;min-width:0">' +
                          '<div class="li-title">' + esc(f.email || f.name || '—') + '</div>' +
                          '<div class="li-sub">' + esc(f.error || 'Unknown error') + '</div></div></div>';
                      }).join('') + '</div>',
                    actions: [{ label: 'Close' }]
                  });
                }
                if (r.templateError) App.toast('Email sent, but the template could not be saved: ' + r.templateError, 'warn');
                App.refresh();
              }).catch(function (e) { App.busy(false); App.toast(e.message, 'bad'); });
            });
          },
          'tpl-load': function (id) {
            var t = templates.find(function (x) { return x.templateId === id; });
            if (!t) return;
            mount.querySelector('#emSubject').value = t.subject || '';
            mount.querySelector('#emBody').value = t.body || '';
            App.toast('Template “' + t.name + '” loaded into the composer.', 'good');
          },
          'tpl-del': function (id) {
            var t = templates.find(function (x) { return x.templateId === id; });
            App.confirm({ title: 'Delete template',
              message: 'Delete the template “' + (t ? t.name : '') + '”? This cannot be undone.',
              confirmLabel: 'Delete', tone: 'danger' }).then(function (ok) {
              if (!ok) return;
              App.api('api_emailTemplateDelete', { templateId: id })
                .then(function () { App.toast('Template deleted.', 'good'); App.refresh(); })
                .catch(function (e) { App.toast(e.message, 'bad'); });
            });
          }
        });
      });
    }
  };

  /* ======================================================================
     MODULE EXPORT
     ====================================================================== */
  window.AdminUI = {
    defaultView: 'dashboard',
    nav: [
      { group: 'Overview', items: [{ id: 'dashboard', label: 'Dashboard', icon: '🏠' }] },
      { group: 'Work', items: [
        { id: 'tasks', label: 'Tasks', icon: '🗂️' },
        { id: 'validation', label: 'Validation', icon: '✅' }
      ] },
      { group: 'People', items: [
        { id: 'staff', label: 'Staff', icon: '👥' },
        { id: 'attendance', label: 'Attendance', icon: '🕘' },
        { id: 'discipline', label: 'Discipline', icon: '⚠️' }
      ] },
      { group: 'Finance', items: [
        { id: 'payroll', label: 'Payroll', icon: '💰' },
        { id: 'allocation', label: 'Allocation', icon: '🧮' },
        { id: 'reports', label: 'Reports', icon: '📊' }
      ] },
      { group: 'Workspace', items: [
        { id: 'email', label: 'Email', icon: '✉️' },
        { id: 'documents', label: 'Documents', icon: '📁' },
        { id: 'settings', label: 'Settings', icon: '⚙️' }
      ] }
    ],
    views: views
  };
})();
</script>
